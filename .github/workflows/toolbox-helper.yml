name: Toolbox helper

# CodeMate Toolbox pins one commit of this fork and ships its helper and
# TypeScript SDK together. This builds both from that commit and publishes
# them as the prerelease `toolbox-<12-character sha>`:
#
#   hex-linux-x64, hex-linux-arm64          the bare executables
#   hex-win32-x64.exe, hex-win32-arm64.exe  (Windows GUI subsystem)
#   hex-darwin-x64, hex-darwin-arm64        (ad-hoc signed, not notarized)
#   hex-sdk.tar.gz                          sdk/ as Toolbox stages it
#   LICENSE, THIRD_PARTY_NOTICES.md
#   toolbox-manifest.json                   commit, versions, file digests
#   SHA256SUMS
#
# Toolbox's scripts/sync-vendor-binaries.js downloads the release named by
# its pin and refuses any file whose digest differs from the manifest.
# Executables come from build-desktop.yml as test builds (HEX_TEST_BUILD), so
# they never update themselves. macOS builds with Xcode on GitHub-hosted runners;
# the consuming app must handle Developer ID signing and notarization.
# Manual runs upload the complete vendor bundle without publishing by default.
#
# Release a commit by pushing its tag (GitHub dispatches workflows only from
# the default branch, which tracks upstream):
#   git tag toolbox-$(git rev-parse --short=12 HEAD) && git push <fork> <that tag>
on:
  push:
    tags: ["toolbox-*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build; the dispatched ref when empty
        required: false
        type: string
      publish:
        description: Also publish a Toolbox prerelease (tag pushes always publish)
        type: boolean
        default: false
      native-macos-arm64:
        description: Use an Apple silicon runner and run the native SDK smoke (subject to hosted-runner capacity)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: toolbox-helper-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: resolve
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          short=$(git rev-parse --short=12 HEAD)
          # A pushed tag names the commit it releases.
          if [ -n "$PUSHED_TAG" ] && [ "$PUSHED_TAG" != "toolbox-$short" ]; then
            echo "::error::tag $PUSHED_TAG must be toolbox-$short, the commit it points at"
            exit 1
          fi
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "short=$short"
            echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hex") | .version')"
            echo "tag=toolbox-$short"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: resolve
    uses: ./.github/workflows/build-desktop.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.version }}
      test-build: true
      artifact-prefix: toolbox-${{ needs.resolve.outputs.short }}
      retention-days: 7

  macos-arm64:
    name: macOS arm64
    needs: resolve
    # Intel runners can also compile the ARM64 target with Apple's toolchain.
    # Keep a native opt-in without making every vendor build depend on that pool.
    runs-on: ${{ inputs.native-macos-arm64 && 'macos-15' || 'macos-26-intel' }}
    timeout-minutes: 90
    env:
      HEX_TEST_BUILD: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      HEX_MACOS_ARCH: arm64
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps: &macos-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ env.HEX_MACOS_ARCH == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: toolbox-macos-${{ env.HEX_MACOS_ARCH }}
          cache-on-failure: true
      - name: Check Xcode and install the Metal toolchain
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            # macOS 15 defaults to Xcode 16; the Swift bridges need the 26 SDK.
            export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build and check the vendor executable
        id: build
        run: |
          if [ "$(uname -m)" = "$HEX_MACOS_ARCH" ]; then
            native_build=true
            TRANSCRIBE_CMAKE_ARGS="-DGGML_NATIVE=OFF" cargo build --locked --release --bin hex
            compiled=target/release/hex
          else
            test "$(uname -m)" = x86_64
            test "$HEX_MACOS_ARCH" = arm64
            native_build=false
            TRANSCRIBE_CMAKE_ARGS="-DGGML_NATIVE=OFF -DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_OSX_ARCHITECTURES=arm64" \
              cargo build --locked --release --bin hex --target aarch64-apple-darwin
            compiled=target/aarch64-apple-darwin/release/hex
          fi
          echo "native=$native_build" >> "$GITHUB_OUTPUT"
          mkdir -p dist/vendor
          executable="dist/vendor/hex-darwin-$HEX_MACOS_ARCH"
          cp "$compiled" "$executable"
          chmod 755 "$executable"
          test "$(lipo -archs "$executable")" = "$HEX_MACOS_ARCH"
          codesign --force --sign - "$executable"
          codesign --verify --strict --verbose=2 "$executable"
          otool -L "$executable"
          if [ "$native_build" = true ]; then
            "$executable" --version
          else
            echo 'macOS ARM64 was cross-compiled on Intel; native execution and inference were not tested.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check the SDK child handshake and shutdown
        if: steps.build.outputs.native == 'true'
        run: |
          python3 - <<'PY'
          import json, os, pathlib, selectors, subprocess, tempfile, urllib.request

          executable = pathlib.Path(f"dist/vendor/hex-darwin-{os.environ['HEX_MACOS_ARCH']}").resolve()
          with tempfile.TemporaryDirectory(prefix="hex-vendor-smoke-") as runtime:
              support = pathlib.Path(runtime) / "support"
              env = {**os.environ, "HEX_APPLICATION_SUPPORT_DIR": str(support)}
              with open(pathlib.Path(runtime) / "stderr.log", "w+") as log:
                  child = subprocess.Popen([str(executable), "service", "--embedded"],
                                           stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                           stderr=log, env=env)
                  try:
                      with selectors.DefaultSelector() as ready:
                          ready.register(child.stdout, selectors.EVENT_READ)
                          if not ready.select(timeout=30):
                              raise RuntimeError("Timed out waiting for the SDK handshake")
                      endpoint = json.loads(child.stdout.readline())
                      assert endpoint["type"] == "ready" and endpoint["apiVersion"] == "2"
                      assert endpoint["pid"] == child.pid
                      assert not (support / "local-api.json").exists()
                      request = urllib.request.Request(endpoint["url"] + "/health",
                          headers={"Authorization": "Bearer " + endpoint["token"]})
                      with urllib.request.urlopen(request, timeout=10) as response:
                          assert json.load(response)["apiVersion"] == "2"
                      child.stdin.close()
                      assert child.wait(timeout=15) == 0
                  except Exception:
                      log.seek(0)
                      print(log.read())
                      raise
                  finally:
                      if child.poll() is None:
                          child.kill()
                          child.wait(timeout=10)
          print("SDK child handshake and shutdown passed (no microphone or inference).")
          PY
      - id: upload
        uses: ./.github/release/upload
        with:
          name: toolbox-${{ needs.resolve.outputs.short }}-macos-${{ env.HEX_MACOS_ARCH }}
          path: dist/vendor
          retention-days: 7

  macos-x64:
    name: macOS x64
    needs: resolve
    runs-on: macos-26-intel
    timeout-minutes: 90
    env:
      HEX_TEST_BUILD: "1"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      HEX_MACOS_ARCH: x86_64
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    steps: *macos-steps

  sdk:
    needs: resolve
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.upload.outputs.digest }}
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check, test, and build
        working-directory: sdk/typescript
        run: |
          bun run check
          bun run test
          bun run build
      # The layout Toolbox stages (scripts/sync-hex.js): dist/ plus a
      # package.json that makes Node load it as ESM.
      - name: Pack
        working-directory: sdk/typescript
        run: |
          staging="$RUNNER_TEMP/sdk"
          mkdir -p "$staging" "$RUNNER_TEMP/out"
          cp -R dist/. "$staging/"
          jq '{name, version, type: "module"}' package.json > "$staging/package.json"
          tar -czf "$RUNNER_TEMP/out/hex-sdk.tar.gz" -C "$staging" .
      - id: upload
        uses: ./.github/release/upload
        with:
          name: toolbox-${{ needs.resolve.outputs.short }}-sdk
          path: ${{ runner.temp }}/out
          retention-days: 7

  publish:
    needs: [resolve, desktop, macos-arm64, macos-x64, sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT: ${{ needs.resolve.outputs.short }}
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: toolbox-${{ needs.resolve.outputs.short }}-*
          path: ${{ runner.temp }}/artifacts
      # Each build artifact's SHA256SUMS must be the one its job reported,
      # and every file must match it.
      - name: Verify the build artifacts
        env:
          DIGESTS: >-
            linux-x86_64=${{ needs.desktop.outputs.linux-x64-digest }}
            linux-aarch64=${{ needs.desktop.outputs.linux-arm64-digest }}
            windows-x86_64=${{ needs.desktop.outputs.windows-x64-digest }}
            windows-aarch64=${{ needs.desktop.outputs.windows-arm64-digest }}
            macos-arm64=${{ needs.macos-arm64.outputs.digest }}
            macos-x86_64=${{ needs.macos-x64.outputs.digest }}
            sdk=${{ needs.sdk.outputs.digest }}
        run: |
          for entry in $DIGESTS; do
            directory="$RUNNER_TEMP/artifacts/toolbox-$SHORT-${entry%%=*}"
            actual=$(sha256sum "$directory/SHA256SUMS" | cut -d' ' -f1)
            [ "$actual" = "${entry#*=}" ] || { echo "::error::${entry%%=*}: SHA256SUMS digest $actual, expected ${entry#*=}"; exit 1; }
            (cd "$directory" && sha256sum --check --strict SHA256SUMS)
          done
      - name: Assemble the release
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          artifacts="$RUNNER_TEMP/artifacts/toolbox-$SHORT"
          cp "$artifacts-linux-x86_64/hex-$VERSION-linux-x64" "$out/hex-linux-x64"
          cp "$artifacts-linux-aarch64/hex-$VERSION-linux-arm64" "$out/hex-linux-arm64"
          cp "$artifacts-windows-x86_64/hex-$VERSION-windows-x64.exe" "$out/hex-win32-x64.exe"
          cp "$artifacts-windows-aarch64/hex-$VERSION-windows-arm64.exe" "$out/hex-win32-arm64.exe"
          cp "$artifacts-macos-arm64/hex-darwin-arm64" "$out/hex-darwin-arm64"
          cp "$artifacts-macos-x86_64/hex-darwin-x86_64" "$out/hex-darwin-x64"
          cp "$artifacts-sdk/hex-sdk.tar.gz" "$out/"
          cp LICENSE THIRD_PARTY_NOTICES.md "$out/"
          chmod 755 "$out"/hex-linux-* "$out"/hex-darwin-*
          sdk_version=$(jq -r .version sdk/typescript/package.json)
          digest() { sha256sum "$out/$1" | cut -d' ' -f1; }
          helper() { jq -n --arg file "$1" --arg sha256 "$(digest "$1")" '{file: $file, sha256: $sha256}'; }
          jq -n \
            --arg commit "$SHA" --arg version "$VERSION" --arg sdkVersion "$sdk_version" \
            --argjson linux_x64 "$(helper hex-linux-x64)" \
            --argjson linux_arm64 "$(helper hex-linux-arm64)" \
            --argjson win32_x64 "$(helper hex-win32-x64.exe)" \
            --argjson win32_arm64 "$(helper hex-win32-arm64.exe)" \
            --argjson darwin_x64 "$(helper hex-darwin-x64)" \
            --argjson darwin_arm64 "$(helper hex-darwin-arm64)" \
            --argjson sdk "$(helper hex-sdk.tar.gz)" \
            --argjson license "$(helper LICENSE)" \
            --argjson notices "$(helper THIRD_PARTY_NOTICES.md)" \
            '{commit: $commit, version: $version, sdkVersion: $sdkVersion,
              helpers: {"linux-x64": $linux_x64, "linux-arm64": $linux_arm64,
                        "win32-x64": $win32_x64, "win32-arm64": $win32_arm64,
                        "darwin-x64": $darwin_x64, "darwin-arm64": $darwin_arm64},
              sdk: $sdk, notices: [$license, $notices]}' > "$out/toolbox-manifest.json"
          (cd "$out" && sha256sum -- * > SHA256SUMS)
          cat "$out/toolbox-manifest.json"
      # Toolbox ships the bare executable, not Hex's .deb, so its packages'
      # dependencies are not installed for it: list what it loads, and start
      # it on a clean Debian 12, the oldest supported distribution.
      - name: Check the Linux helper's runtime libraries
        run: |
          {
            echo '### hex-linux-x64 dynamic libraries'
            echo '```'
            ldd "$RUNNER_TEMP/release/hex-linux-x64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$RUNNER_TEMP/release:/release:ro" debian:12 sh -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends libasound2 libssl3 libvulkan1 libxkbcommon0 \
              libxkbcommon-x11-0 libx11-6 libxcb1 libxcursor1 libxi6 libwayland-client0 > /dev/null
            missing=$(ldd /release/hex-linux-x64 | grep "not found" || true)
            [ -z "$missing" ] || { echo "Missing libraries: $missing"; exit 1; }
            /release/hex-linux-x64 --version'
      - name: Upload the complete vendor bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolbox-${{ needs.resolve.outputs.short }}-vendor-bundle
          path: ${{ runner.temp }}/release
          retention-days: 7
          if-no-files-found: error
      - name: Publish
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --latest=false \
            --title "Toolbox helper $SHORT" \
            --notes "Hex $VERSION helper and TypeScript SDK for CodeMate Toolbox, built from $SHA. Pin it in Toolbox's config/hex/pin.json."
